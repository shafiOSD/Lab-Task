<!DOCTYPE html>
<html>

	<head>
		<title> Reg Form</title>
		<link rel = "stylesheet" href = "Task.css">
	</head>
	
	<body>
		<h1> Registration Form</h1><br>
		
	<form>
		<label for = "fullname">Full Name: </label>
		<input type = "text" name = "fullname" id = "fullname" required>
		<br><br>
		
		<label for = "password">Password: </label>
		<input type = "password" name = "password" id = "password">
		<br> <br>
		
		<label for = "dob">Date of Birth: </label>
		<input type = "date" name = "dob" id = "dob">
		<br> <br>
		
		<label for = "photo">Photos: </label>
		<input type = "file" name = "photo" id = "photo">
		<br> <br>
		
		<label for= "gender">Gender: </label>
		<input type = "radio" name = "gender" value = "Male" id = "male" checked>Male
		<input type = "radio" name = "gender" value = "Female" id = "female">Female
		<br> <br>
		
		<label for = "religion">Religion: </label>
		<input type = "checkbox" name = "religion" value="Islam" id = "islam" checked>Islam
		<input type = "checkbox" name = "religion" value="Hindu" id = "hindu" >Hindu
		<br> <br>
		
		<div>
		<label for = "department"> Department: </label>
		<select name = "department">
			<option value = "CSE" selected> CSE </option>
			<option value = "EEE" > EEE </option>
			<option value = "BBA" > BBA </option>
		</div></select> <br> <br>	
		
		<div>
		<label for = "address">Enter Address: </label>
		<textarea col = "5" rows = "10"> </textarea>
		</div> <br> 
		
		<div>
			<input type = "submit" value = "Register">
			<input type = "reset" value = "Clear">
		</div>
		
	
	</form>
	
	
	</body>


</html>
